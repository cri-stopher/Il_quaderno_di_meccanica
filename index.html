<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quaderno di Ingegneria Meccanica</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Archivo:wght@400;500;600;700&display=swap');

/* ====== TOKENS ====== */
:root{
  --paper: #EDEBE3;
  --paper-raised: #F5F3EC;
  --ink: #1C1E1B;
  --ink-soft: #55564E;
  --ink-faint: #8B8C82;
  --blue: #33506E;
  --blue-deep: #223649;
  --oxide: #A85C34;
  --line: #D3CFC2;
  --weave: #14151A;
  --radius: 3px;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Source Serif 4', Georgia, serif;
  -webkit-font-smoothing: antialiased;
}
::selection{ background: var(--blue); color: var(--paper-raised); }

a{ color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover{ color: var(--oxide); }

:focus-visible{
  outline: 2px solid var(--oxide);
  outline-offset: 2px;
}

/* ====== LAYOUT ====== */
.app{
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 100vh;
}

/* ---- Sidebar ---- */
.sidebar{
  background: var(--weave);
  color: #E7E4D8;
  padding: 32px 26px 40px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand{
  margin: 0 0 4px;
  font-family: 'Archivo', sans-serif;
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: 0.01em;
  color: #F5F3EC;
}
.brand-sub{
  margin: 0 0 28px;
  font-size: 0.82rem;
  color: #9B9C8F;
  font-family: 'Archivo', sans-serif;
  line-height: 1.5;
}

.weave-mark{
  width: 100%;
  height: 44px;
  margin-bottom: 22px;
  display: block;
}

.toc-group{ margin-bottom: 26px; }
.toc-group-title{
  font-family: 'Archivo', sans-serif;
  font-size: 0.72rem;
  color: #7C7E70;
  letter-spacing: 0.04em;
  margin: 0 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #33352C;
}
.toc-list{ list-style: none; margin: 0; padding: 0; }
.toc-item{ margin: 0; }
.toc-link{
  display: flex;
  gap: 10px;
  align-items: baseline;
  padding: 7px 4px;
  color: #C9C7B8;
  text-decoration: none;
  font-size: 0.92rem;
  line-height: 1.4;
  border-radius: var(--radius);
  transition: background 0.15s ease, color 0.15s ease;
}
.toc-link:hover{ background: #202119; color: #F5F3EC; }
.toc-link.active{
  background: var(--blue-deep);
  color: #F5F3EC;
}
.toc-num{
  font-family: 'Archivo', sans-serif;
  font-size: 0.78rem;
  color: var(--oxide);
  flex-shrink: 0;
  min-width: 1.4em;
}

/* ---- Main ---- */
.main{
  padding: 56px 48px 100px;
  max-width: 760px;
}
.main-inner{ max-width: 66ch; }

/* Intro / index view */
.hero-weave{
  width: 100%;
  max-width: 420px;
  height: auto;
  margin-bottom: 32px;
  display: block;
}
.hero-title{
  font-size: clamp(1.9rem, 3vw, 2.5rem);
  line-height: 1.2;
  margin: 0 0 14px;
  font-weight: 600;
}
.hero-lede{
  font-size: 1.08rem;
  color: var(--ink-soft);
  line-height: 1.65;
  margin: 0 0 40px;
  max-width: 58ch;
}
.index-list{ list-style: none; margin: 0; padding: 0; }
.index-row{
  display: flex;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  align-items: baseline;
  cursor: pointer;
}
.index-row:first-child{ border-top: 1px solid var(--line); }
.index-num{
  font-family: 'Archivo', sans-serif;
  color: var(--oxide);
  font-size: 0.85rem;
  min-width: 2ch;
}
.index-meta{ flex: 1; }
.index-title{
  font-size: 1.08rem;
  margin: 0 0 3px;
  color: var(--ink);
}
.index-cat{
  font-family: 'Archivo', sans-serif;
  font-size: 0.76rem;
  color: var(--ink-faint);
  letter-spacing: 0.01em;
}
.index-row:hover .index-title{ color: var(--blue); }

/* Article view */
.article-cat{
  font-family: 'Archivo', sans-serif;
  font-size: 0.8rem;
  color: var(--oxide);
  margin: 0 0 10px;
}
.article-title{
  font-size: clamp(1.7rem, 2.6vw, 2.2rem);
  line-height: 1.25;
  margin: 0 0 8px;
  font-weight: 600;
}
.article-date{
  font-family: 'Archivo', sans-serif;
  font-size: 0.82rem;
  color: var(--ink-faint);
  margin: 0 0 40px;
}
.article-body{ font-size: 1.08rem; line-height: 1.75; }
.article-body h2{
  font-size: 1.35rem;
  margin: 2.2em 0 0.7em;
  font-weight: 600;
  border-top: 1px solid var(--line);
  padding-top: 0.9em;
}
.article-body h3{ font-size: 1.12rem; margin: 1.8em 0 0.6em; font-weight: 600; }
.article-body p{ margin: 0 0 1.2em; }
.article-body ul, .article-body ol{ margin: 0 0 1.2em; padding-left: 1.4em; }
.article-body li{ margin-bottom: 0.4em; }
.article-body strong{ font-weight: 600; }
.article-body code{
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.1em 0.4em;
  font-size: 0.9em;
}
.article-body pre{
  background: var(--weave);
  color: #36b3d3;
  padding: 18px 20px;
  border-radius: var(--radius);
  overflow-x: auto;
  margin: 0 0 1.4em;
}
.article-body pre code{ background: none; border: none; padding: 0; }
.article-body blockquote{
  margin: 0 0 1.4em;
  padding: 4px 0 4px 18px;
  border-left: 3px solid var(--oxide);
  color: var(--ink-soft);
}
.article-body table{ border-collapse: collapse; margin: 0 0 1.4em; width: 100%; }
.article-body th, .article-body td{
  border: 1px solid var(--line);
  padding: 8px 12px;
  text-align: left;
  font-size: 0.95em;
}
.article-body th{ background: var(--paper-raised); font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 0.82em; }
.katex-display{ margin: 1.4em 0; overflow-x: auto; overflow-y: hidden; }

.back-link{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Archivo', sans-serif;
  font-size: 0.85rem;
  color: var(--ink-soft);
  text-decoration: none;
  margin-bottom: 36px;
}
.back-link:hover{ color: var(--blue); }

/* mobile */
.menu-toggle{ display: none; }
@media (max-width: 860px){
  .app{ grid-template-columns: 1fr; }
  .sidebar{
    position: relative;
    height: auto;
    padding: 20px 22px;
  }
  .menu-toggle{
    display: block;
    background: none;
    border: 1px solid #3A3B31;
    color: #36b3d3;
    font-family: 'Archivo', sans-serif;
    font-size: 0.85rem;
    padding: 8px 14px;
    border-radius: var(--radius);
    margin-top: 14px;
    cursor: pointer;
  }
  .toc-wrap.collapsed{ display: none; }
  .main{ padding: 36px 22px 80px; }
}

@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
  *{ transition: none !important; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <svg class="weave-mark" viewBox="0 0 260 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <pattern id="weave" width="16" height="16" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="none"/>
          <path d="M0 8 H16 M8 0 V16" stroke="#3A3B31" stroke-width="1.5"/>
          <rect x="0" y="0" width="8" height="8" fill="#242519"/>
          <rect x="8" y="8" width="8" height="8" fill="#242519"/>
        </pattern>
      </defs>
      <rect width="260" height="44" fill="url(#weave)"/>
      <rect x="0" y="0" width="260" height="44" fill="none" stroke="#33506E" stroke-width="1" opacity="0.5"/>
    </svg>
    <p class="brand">Quaderno di Meccanica</p>
    <p class="brand-sub">Appunti e capitoli — Ingegneria Meccanica, laurea magistrale</p>

    <button class="menu-toggle" id="menuToggle">Indice ▾</button>

    <div class="toc-wrap collapsed" id="tocWrap"></div>
  </aside>

  <main class="main">
    <div class="main-inner" id="content"></div>
  </main>
</div>

<script>
/* ======================================================================
   PER AGGIUNGERE UN NUOVO POST:
   aggiungi un nuovo oggetto a questo array. Campi:
     id            -> stringa univoca, senza spazi (usata nell'URL #ancora)
     category      -> nome della sezione nella sidebar (es. "Tesi", "Appunti corso X")
     chapterNumber -> opzionale, numero se il post fa parte di una sequenza (es. capitoli tesi)
     title         -> titolo del post
     date          -> "AAAA-MM-GG"
     content       -> testo in Markdown (usa i backtick ` per racchiuderlo).
                       Per le formule: $...$ per formule in linea, $$...$$ per formule a blocco.
   ====================================================================== */
const posts = [
  {
    id: 'benvenuto',
    category: 'Guida',
    title: 'Come funziona questo quaderno',
    date: '2026-09-03',
    content: `Questo sito raccoglie concetti, capitoli e appunti scritti durante il percorso di laurea magistrale, organizzati come un indice consultabile.

Ogni voce è scritta in **Markdown** e può contenere formule matematiche, tabelle e codice. Le voci legate alla tesi sono numerate come capitoli; gli appunti generali no.

Per aggiungere un nuovo post: apri il file \`index.html\`, trova l'array \`posts\` in cima allo script, e aggiungi un nuovo blocco con titolo, categoria, data e contenuto in Markdown. Nessun altro passaggio è necessario — il sito si aggiorna da solo alla ricarica della pagina.`
  },
  {
    id: 'ch07-energia',
    category: 'Tesi — Impatti balistici su laminati CFRP',
    chapterNumber: 7,
    title: 'Bilancio energetico per impatti ad alta velocità',
    date: '2026-09-03',
    content: `## Impostazione del modello

L'approccio analitico si basa su un bilancio energetico tra l'energia cinetica del proiettile e i meccanismi dissipativi attivati durante la penetrazione del laminato woven.

L'energia cinetica residua dopo l'impatto si esprime come:

$$
E_r = E_i - E_d
$$

dove \\(E_i\\) è l'energia cinetica incidente ed \\(E_d\\) è l'energia totale dissipata dal laminato, somma dei contributi di:

- deformazione elastica delle lamine,
- frattura delle fibre nella zona di contatto,
- delaminazione tra i piani,
- attrito proiettile–laminato,
- cricche nella matrice.

## Velocità limite balistica

La velocità limite \\(V_{bl}\\) — la minima velocità per cui si ha perforazione completa — si ricava imponendo \\(E_r \\to 0\\):

$$
V_{bl} = \\sqrt{\\frac{2 E_d}{m_p}}
$$

con \\(m_p\\) massa del proiettile. Questo valore viene poi confrontato con i dati sperimentali di Buitrago et al. per la validazione del modello a singolo impatto, prima di estendere la trattazione al caso di impatto multi-sito (doppio impatto, capitolo 8).`
  },
  {
    id: 'appunti-bezier',
    category: 'Appunti — Modellazione geometrica',
    title: 'Curve di Bézier: idea di base',
    date: '2026-08-20',
    content: `Una curva di Bézier di grado \\(n\\) è definita da \\(n+1\\) punti di controllo \\(P_0, \\dots, P_n\\) tramite i polinomi di Bernstein:

$$
B(t) = \\sum_{i=0}^{n} \\binom{n}{i} (1-t)^{n-i} t^i \\, P_i, \\quad t \\in [0,1]
$$

Proprietà chiave da ricordare per l'esame:

- la curva passa sempre per \\(P_0\\) e \\(P_n\\), ma non necessariamente per i punti intermedi;
- è contenuta nell'inviluppo convesso dei punti di controllo;
- è invariante per trasformazioni affini applicate ai punti di controllo.`
  }
];

/* ====== RENDER LOGIC (non serve modificarlo per aggiungere post) ====== */
marked.setOptions({ breaks: false });

function groupByCategory(items){
  const map = new Map();
  items.forEach(p => {
    if(!map.has(p.category)) map.set(p.category, []);
    map.get(p.category).push(p);
  });
  return map;
}

function buildSidebar(){
  const wrap = document.getElementById('tocWrap');
  wrap.innerHTML = '';
  const groups = groupByCategory(posts);
  groups.forEach((items, cat) => {
    const g = document.createElement('div');
    g.className = 'toc-group';
    g.innerHTML = `<p class="toc-group-title">${cat}</p>`;
    const ul = document.createElement('ul');
    ul.className = 'toc-list';
    items.forEach(p => {
      const li = document.createElement('li');
      li.className = 'toc-item';
      li.innerHTML = `<a class="toc-link" href="#${p.id}" data-id="${p.id}">
        ${p.chapterNumber ? `<span class="toc-num">${String(p.chapterNumber).padStart(2,'0')}</span>` : '<span class="toc-num">—</span>'}
        <span>${p.title}</span>
      </a>`;
      ul.appendChild(li);
    });
    g.appendChild(ul);
    wrap.appendChild(g);
  });
}

function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
}

function renderIndex(){
  const el = document.getElementById('content');
  const rows = posts.map((p, i) => `
    <li class="index-row" data-id="${p.id}">
      <span class="index-num">${p.chapterNumber ? String(p.chapterNumber).padStart(2,'0') : String(i+1).padStart(2,'0')}</span>
      <div class="index-meta">
        <p class="index-title">${p.title}</p>
        <p class="index-cat">${p.category} · ${formatDate(p.date)}</p>
      </div>
    </li>`).join('');

  el.innerHTML = `
    <svg class="hero-weave" viewBox="0 0 420 90" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <pattern id="weave2" width="18" height="18" patternUnits="userSpaceOnUse">
          <rect width="9" height="9" fill="#1C1E1B" opacity="0.85"/>
          <rect x="9" y="9" width="9" height="9" fill="#1C1E1B" opacity="0.85"/>
        </pattern>
      </defs>
      <rect width="420" height="90" fill="url(#weave2)"/>
      <line x1="0" y1="45" x2="420" y2="45" stroke="#A85C34" stroke-width="1.5" opacity="0.7"/>
    </svg>
    <h1 class="hero-title">Quaderno di Ingegneria Meccanica</h1>
    <p class="hero-lede">Concetti, capitoli di tesi e appunti di corso, raccolti in un unico indice consultabile.</p>
    <ul class="index-list">${rows}</ul>
  `;
  el.querySelectorAll('.index-row').forEach(row => {
    row.addEventListener('click', () => { location.hash = row.dataset.id; });
  });
  document.title = 'Quaderno di Ingegneria Meccanica';
}

function renderPost(post){
  const el = document.getElementById('content');
  el.innerHTML = `
    <a class="back-link" href="#">← Indice</a>
    <p class="article-cat">${post.category}</p>
    <h1 class="article-title">${post.title}</h1>
    <p class="article-date">${formatDate(post.date)}</p>
    <div class="article-body">${marked.parse(post.content)}</div>
  `;
  renderMathInElement(el, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false},
      {left: '\\[', right: '\\]', display: true}
    ]
  });
  document.title = post.title + ' — Quaderno di Meccanica';
  window.scrollTo(0,0);
}

function route(){
  const id = location.hash.replace('#','');
  document.querySelectorAll('.toc-link').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  const post = posts.find(p => p.id === id);
  if(post) renderPost(post); else renderIndex();
}

buildSidebar();
window.addEventListener('hashchange', route);
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('tocWrap').classList.toggle('collapsed');
});
route();
</script>
</body>
</html>
